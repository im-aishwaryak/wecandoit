<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lost & Found</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>📦 Lost & Found</h1>
                <div class="user-info">
                    <span class="user-email" id="userEmail"></span>
                    <button class="btn btn-secondary" id="signOutBtn">Sign Out</button>
                </div>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-btn">🏠 Home</a>
                <a href="post-item.html" class="nav-btn">➕ Post Found Item</a>
                <a href="browse-items.html" class="nav-btn">🔍 Search Items</a>
                <a href="admin.html" class="nav-btn active" id="adminNavBtn">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="content-section">
            <h2>Admin Dashboard</h2>
            
            <div class="admin-stats">
                <div class="stat-card">
                    <div class="stat-number" id="statPending">0</div>
                    <div class="stat-label">Pending Approval</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statActive">0</div>
                    <div class="stat-label">Active Items</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statClaims">0</div>
                    <div class="stat-label">Pending Claims</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statClaimed">0</div>
                    <div class="stat-label">Items Claimed</div>
                </div>
            </div>

            <h3>Pending Item Approvals</h3>
            <div id="pendingItems">Loading...</div>

            <h3 style="margin-top: 40px;">All Claims</h3>
            <div id="allClaims">Loading...</div>
        </div>
    </main>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/admin.js"></script>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
