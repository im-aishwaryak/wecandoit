<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boomerang - Lost and Found Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <p class="logo">Logo</p>
        <ul class="nav-menu">
            <li>Browse Items</li>
            <li>Report Item</li>
            <li>Profile</li>
        </ul>
    </nav>


    <div id="browse-page" class="page hidden">
        <div class="container">
            <h2 style="font-size: 1.875rem; font-weight: bold; margin-bottom: 1.5rem;">Browse Found Items</h2>

            <div class="search-filter">
                <input type="text" id="search-input" placeholder="Search items..." onkeyup="filterItems()">
                <select id="category-filter" onchange="filterItems()">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div id="items-container" class="items-grid"></div>
            <div id="empty-state" class="empty-state hidden">
                <i data-feather="package" width="64" height="64"></i>
                <p>No items found matching your search</p>
            </div>
        </div>
    </div>
</body>
