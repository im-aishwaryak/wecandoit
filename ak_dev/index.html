<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lost & Found - Login</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>📦 School Lost & Found</h1>
            <p class="subtitle">Secure lost and found system for our school community</p>
            
            <div class="alert alert-info">
                Please sign in with your school email to continue.
            </div>
            
            <form id="authForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="your.name@apps.nsd.org" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="Enter password" required>
                </div>
                
                <button type="button" class="btn btn-primary" id="signInBtn">Sign In</button>
                <button type="button" class="btn btn-secondary" id="signUpBtn">Create Account</button>
            </form>
            
            <div id="authError"></div>
        </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
